<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Download CV — Kelvin Oladotun Esanoluwa</title>
  <style>
    :root {
      --navy: #1b365d;
      --slate: #334155;
      --muted: #64748b;
      --line: #d6dee8;
      --bg: #f6f8fb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Calibri", "Segoe UI", Arial, sans-serif;
      color: var(--slate);
      background: var(--bg);
    }
    main {
      max-width: 640px;
      margin: 48px auto;
      padding: 36px 32px;
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: 0 8px 24px rgba(27, 54, 93, 0.06);
    }
    h1 {
      margin: 0 0 6px;
      color: var(--navy);
      font-size: 28px;
      letter-spacing: 0.02em;
    }
    p.lead {
      margin: 0 0 28px;
      color: var(--muted);
    }
    .links { display: grid; gap: 12px; }
    a.btn {
      display: block;
      padding: 14px 16px;
      text-decoration: none;
      color: #fff;
      background: var(--navy);
      border: 1px solid var(--navy);
      font-weight: 700;
    }
    a.btn.secondary {
      background: #fff;
      color: var(--navy);
    }
    a.btn:hover { opacity: 0.92; }
    .note {
      margin-top: 24px;
      font-size: 14px;
      color: var(--muted);
    }
    code { font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>Kelvin Oladotun Esanoluwa</h1>
    <p class="lead">Download the rewritten curriculum vitae.</p>
    <div class="links">
      <a class="btn" href="Kelvin_Oladotun_Esanoluwa_CV.pdf" download="Kelvin_Oladotun_Esanoluwa_CV.pdf">Download PDF</a>
      <a class="btn secondary" href="Kelvin_Oladotun_Esanoluwa_CV.docx" download="Kelvin_Oladotun_Esanoluwa_CV.docx">Download Word (.docx)</a>
      <a class="btn secondary" href="Kelvin_Oladotun_Esanoluwa_CV.md" download="Kelvin_Oladotun_Esanoluwa_CV.md">Download Markdown</a>
    </div>
    <p class="note">
      If a browser opens the file instead of saving it, use Save As, or download from
      GitHub using the raw file links in the README.
    </p>
  </main>
</body>
</html>
